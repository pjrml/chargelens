}

}

'<div class="c"><div class="lab">Thresholds</div><div class="bar" id="bar"></div><div class="mu" id="leg"></div>'+

'<details><summary>Advanced</summary>'+fl('h','Hysteresis (A)','',c.h)+fl('hr','Residual hysteresis (A)','',c.hr)+fl('hs','Band hold time (s)','',c.hs)+fl('sg','Session gap (s)','A session ends after this long without charging current.',c.sg)+'</details></div>'+
'<div class="c"><div class="lab">Relay protection</div>'+fl('current_limit','Current limit (A)','The relay cuts above this. Plug rating: '+MODEL.maxA+' A (manufacturer data); higher values are refused.',n.current_limit)+fl('power_limit','Power limit (W)','The relay cuts above this. Plug rating: '+MODEL.maxW+' W (manufacturer data); higher values are refused.',n.power_limit)+'</div>'+
'<div class="c"><div class="lab">Device</div>'+tx('name','Device name (optional, up to 64 characters)',n.name)+'</div>'+
'<div class="c"><div class="lab">Button</div>'+sl('in_mode','The button',[['detached','does nothing'],['momentary','toggles the relay']],n.in_mode)+'</div>'+
'<div class="c"><div class="lab">Price</div>'+fl('p','Price per kWh (0 = not set)','',c.p)+tx('cu','Currency label (1 to 4 characters)',c.cu)+sl('ds','Decimal separator',[['.','Dot (1.50)'],[',','Comma (1,50)']],c.ds)+sl('df','Date format',[['YMD','2026-11-20'],['DMY','20/11/2026'],['MDY','11/20/2026']],c.df)+'</div>'+
'<div class="c"><div class="lab">Time</div>'+tx('tz','Time zone (e.g. Europe/Berlin)',n.tz)+'<button id="tzp" class="sm">Use this phone\'s time zone</button><div class="mu" id="clk" style="margin-top:10px"></div><button id="ts" class="sm">Set clock from this phone</button></div>'+
'<div class="c"><div class="lab">LED ring</div><div class="f"><label><input type="checkbox" id="f_lo"'+(c.lo?' checked':'')+'>Use the LED ring</label></div>'+fl('lb','Brightness (5 to 100)','',c.lb)+
'<div class="mu" style="margin-top:10px"><span class="dt" style="background:#3b82f6;margin-left:0"></span>idle<span class="dt" style="background:#ef4444"></span>on, not charging<span class="dt" style="background:#10b981"></span>charging<span class="dt" style="background:#f59e0b"></span>above normal<br><span class="dt" style="background:#a855f7;margin-left:0"></span>purple / <span class="dt" style="background:#f97316;margin-left:0"></span>orange: the clock is unknown, set it.</div></div>'+
'<div class="c"><div class="lab">Mail</div>'+tx('to','To',mt.to)+tx('cc','Cc',mt.cc)+tx('bcc','Bcc',mt.bcc)+tx('subject','Subject',mt.subject)+
'<div class="f"><label for="f_body">Body</label><textarea id="f_body" autocapitalize="sentences">'+esc(mt.body)+'</textarea><div class="er" id="e_body"></div></div>'+
'<div class="mu" style="margin-top:8px">Placeholders: {month_name} {month} {year} {total_kwh} {total_cost} {currency} {price} {outside_kwh} {session_count} {sessions_table} {device_name}</div></div>';
bands()}
const num=k=>{const s=$('f_'+k).value.trim().replace(',','.');return s===''?NaN:Number(s)};
function readForm(){const f={},v=k=>$('f_'+k).value;
['r','g','y','h','hr','hs','sg','p','lb','current_limit','power_limit'].forEach(k=>f[k]=num(k));
f.cu=v('cu').trim();f.ds=v('ds');f.df=v('df');f.lo=$('f_lo').checked?1:0;f.in_mode=v('in_mode');f.tz=v('tz');f.name=v('name');
f.mail={to:v('to').trim(),cc:v('cc').trim(),bcc:v('bcc').trim(),subject:v('subject'),body:v('body').replace(/\r\n?/g,'\n')};return f}
function bands(){const f=readForm(),r=f.r,a=f.g,y=f.y,m=Math.max(f.current_limit||MODEL.maxA,y||0,1),s=[[r,'#3b82f6'],[a-r,'#ef4444'],[y-a,'#10b981'],[m-y,'#f59e0b']],ok=s.every(x=>x[0]>=0);
$('bar').innerHTML=ok?s.map(x=>'<div style="flex:'+x[0]+';background:'+x[1]+'"></div>').join(''):'';
$('leg').textContent=ok?'0 A to '+m+' A':'Check the three thresholds.'}
function clock(){return g('/rpc/Sys.GetStatus').then(s=>{$('clk').innerHTML=s.unixtime>1.7e9?'Clock: '+new Date((s.unixtime+(s.utc_offset||0))*1000).toISOString().slice(0,16).replace('T',' ')+(s.utc_offset===undefined?' (UTC)':'')+' <span class="ok">&#10003;</span>':'<span style="color:var(--warn)">&#9888; Clock unknown.</span>'}).catch(e=>{})}
async function load(){
const raw=await g('/rpc/KVS.Get?key=cc:cfg').then(r=>r.value).catch(e=>null);
const [mc,sw,ui,sy,di]=await Promise.all([scode('MailTpl').catch(e=>null),g('/rpc/Switch.GetConfig?id=0'),g('/rpc/PLUGS_UI.GetConfig'),g('/rpc/Sys.GetConfig'),g('/rpc/Shelly.GetDeviceInfo')]);
MODEL=MODELS[di.model]||MODEL;
const c=cfgParse(raw);let mt=null;try{mt=JSON.parse(mc)}catch(e){}if(!mt||typeof mt!=='object')mt=MAILD;
const n={current_limit:sw.current_limit,power_limit:sw.power_limit,in_mode:((ui.controls||{})['switch:0']||{}).in_mode||'detached',tz:(sy.location||{}).tz||'',name:String((sy.device||{}).name||'')};
const m={to:mt.to,cc:mt.cc,bcc:mt.bcc,subject:mt.subject===undefined?MAILD.subject:mt.subject,body:mt.body===undefined?MAILD.body:mt.body};
const ex=await Promise.all(['WiFi','Cloud','BLE','MQTT'].map(x=>g('/rpc/'+x+'.GetConfig').catch(e=>null)));
const ap=(ex[0]||{}).ap;n.ap=ap?{ssid:ap.ssid,enable:!!ap.enable}:null;n.cloud=ex[1]?!!ex[1].enable:null;n.ble=bleState(ex[2]);n.mqtt=ex[3]?!!ex[3].enable:null;
OLD={cfg:storedCfg(c),mail:mailText(m),native:n,name:n.name};DI=di;
$('dev').textContent=(n.name?n.name+' - ':'')+di.model+' (gen '+di.gen+')';
draw(c,n,m);more();clock();$('save').disabled=false}
const ck=(k,l,on)=>'<div class="f"><label><input type="checkbox" id="'+k+'"'+(on?' checked':'')+'>'+l+'</label></div>';
function more(){const n=OLD.native,ap=n.ap||{},hs=[['cloud','Cloud',"Cloud off: no Shelly app access from outside the plug's networks."],['ble','Bluetooth',''],['mqtt','MQTT','']];
$('more').innerHTML=
'<div class="c"><div class="lab">Wi-Fi access point</div><div class="mu">The plug\'s own network, for use without a router. WPA2 only; connecting the plug to your Wi-Fi is not affected.</div>'+
tx('ap_ssid','Network name (SSID)',ap.ssid||apSsid(DI.mac))+
'<div class="f"><label for="ap_pass">Password (at least 8 characters)</label><input id="ap_pass" type="password" autocomplete="new-password"><div class="er" id="e_ap_pass"></div></div>'+
ck('ap_on','Access point on',ap.enable)+'<button id="apx">Apply access point</button><div id="ap_res"></div></div>'+
'<div class="c"><div class="lab">Hardening</div>'+hs.map(x=>{const on=x[0]==='ble'?bleOn(n.ble):n[x[0]];return on===null?'<div class="f">'+x[1]+': <span class="mu">unknown</span></div>':'<div class="f"><label>'+(on?'<input type="checkbox" id="hb_'+x[0]+'" checked><span style="color:var(--warn)">&#9888;</span> Turn '+x[1]+' off (it is on)':'<span class="ok">&#10003;</span> '+x[1]+' is off')+'</label>'+(x[2]&&on?'<div class="mu">'+x[2]+'</div>':'')+'</div>'}).join('')+
'<div class="f"><label>'+(n.in_mode==='detached'?'<span class="ok">&#10003;</span> The button does nothing':'<input type="checkbox" id="hb_button" checked><span style="color:var(--warn)">&#9888;</span> Make the button do nothing (it toggles the relay)')+'</label></div>'+
'<div class="mu" style="margin-top:8px">Fix applies the ticked items.</div><button id="hf">Fix</button><div id="hr_res"></div></div>'+
'<div class="c"><div class="lab">Backup</div><div class="mu">Settings, mail template and device options. No passwords and no energy data.</div>'+
'<button id="ex">Export configuration</button><button id="im">Import configuration</button><input type="file" id="imf" accept=".json,application/json" style="display:none"><div id="im_res"></div><div id="im_go"></div></div>'+
'<div class="c"><div class="lab">About</div><div class="mu" id="ab">&hellip;</div><div style="margin-top:8px"><a href="https://github.com/pjrml/chargelens#readme" target="_blank" rel="noopener">Documentation</a></div><button id="up">Check for updates</button><div class="mu">Pauses this page and the LED while the installer runs (the plug runs at most 3 scripts). The meter keeps counting.</div><div id="up_res" class="mu"></div></div>';
about()}
let VER='dev';
async function about(){let k='?',r='?';VER='dev';
try{const L=await g('/rpc/Script.List'),m=L.scripts.find(x=>x.name==='Meter');if(m){const c=await g('/rpc/Script.GetCode?id='+m.id+'&offset=0'),q=/^\/\/ ChargeLens Meter v(\S+)/.exec(c.data);if(q)VER=q[1]}}catch(e){}
try{let o=0,t=1,c=0,z,d;while(o<t){z=await g('/rpc/KVS.List?offset='+o);t=z.total;d=Object.keys(z.keys).length;if(!d)break;c+=d;o+=d}k=c+'/50'}catch(e){}
try{r=Math.round((await g('/rpc/Sys.GetStatus')).ram_free/1024)+' KB'}catch(e){}
$('ab').innerHTML='Version: '+esc(VER)+'<br>Firmware: '+esc(DI.fw_id||DI.ver||'?')+'<br>Free memory: '+r+'<br>KVS keys: '+k}
async function apApply(){const on=$('ap_on').checked,pass=$('ap_pass').value,ssid=$('ap_ssid').value.trim();$('e_ap_pass').textContent='';
const e=validateForm(Object.assign(readForm(),{ap:{on:on,pass:pass}}),MODEL).errors;
if(on&&e.ap_pass){$('e_ap_pass').textContent=e.ap_pass;return}
if(on&&(!ssid||ssid.length>32)){$('e_ap_pass').textContent='The network name must be 1 to 32 characters';return}
if(viaAp(location.hostname)&&!confirm('You are connected through this access point. Applying the change will disconnect you; reconnect to the new network afterwards. Continue?'))return;
const bad=await runPlan([{rpc:'WiFi.SetConfig',params:{config:{ap:on?{ssid:ssid,pass:pass,is_open:false,enable:true}:{enable:false}}},label:'Access point'}],'ap_res','Done.');
if(!bad)$('ap_pass').value='';try{await load()}catch(x){}}
function exportNow(){const s={model:DI.model,cfg:OLD.cfg,mail:OLD.mail,native:OLD.native},now=new Date(),b=new Blob([JSON.stringify(exportDoc(s,VER,now),null,1)],{type:'application/json'}),a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download=exportFile(s,now);document.body.appendChild(a);a.click();a.remove()}
async function importFile(f){IMP=null;$('im_go').innerHTML='';let d;
try{d=JSON.parse(await f.text())}catch(e){$('im_res').innerHTML='<div class="er">Not a valid file.</div>';return}
const r=importCheck(d,MODEL,{model:DI.model,cfg:OLD.cfg,mail:OLD.mail,native:OLD.native});
if(!r.ok){$('im_res').innerHTML=r.errors.map(x=>'<div class="er">'+esc(x)+'</div>').join('');return}
IMP=r.next;$('im_res').innerHTML=r.changes.length?'<div class="mu">Will change:</div>'+r.changes.map(c=>'<div>'+esc(c.field)+': '+esc(c.from)+' &rarr; '+esc(c.to)+'</div>').join(''):'<div class="mu">Nothing differs.</div>';
if(r.changes.length)$('im_go').innerHTML='<button id="ia">Apply import</button>'}
document.addEventListener('input',e=>{if(OLD&&e.target.id&&e.target.id.charAt(0)==='f')bands();if(OLD&&MODEL)lims()});
function lims(){const f=readForm(),er=validateForm(f,MODEL).errors,n=limitNotes(f,MODEL);['current_limit','power_limit'].forEach(k=>{const a=$('e_'+k),b=$('w_'+k);if(a)a.textContent=er[k]||'';if(b)b.textContent=er[k]?'':(n[k]?'\u26a0 '+n[k]:'')})}
document.addEventListener('click',async e=>{const id=e.target.id;
if(id==='tzp')$('f_tz').value=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
if(id==='ts'){try{await g(B+'time?set='+Math.floor(Date.now()/1000));clock()}catch(x){$('clk').textContent='Could not set the clock'}}
if(id==='save')save();
if(id==='apx')apApply();
if(id==='hf'){const P=hardenPlan({cloud:OLD.native.cloud,ble:OLD.native.ble,mqtt:OLD.native.mqtt,in_mode:OLD.native.in_mode},['cloud','ble','mqtt','button'].reduce((a,k)=>{const x=$('hb_'+k);a[k]=!!(x&&x.checked);return a},{}));if(!P.length){$('hr_res').innerHTML='<div class="mu">Nothing to fix.</div>';return}await runPlan(P,'hr_res','Done.');try{await load()}catch(x){}}
if(id==='ex')exportNow();
if(id==='im')$('imf').click();
if(id==='ia'&&IMP){$('ia').disabled=true;await runPlan(writePlan(OLD,IMP),'im_res','Imported. Live within about a minute.');IMP=null;$('im_go').innerHTML='';try{await load()}catch(x){}}
if(id==='up'){$('up_res').textContent='';try{const L=await g('/rpc/Script.List'),s=L.scripts.find(x=>x.name==='Installer');if(!s){$('up_res').textContent='The installer is not on this plug yet. See the documentation for how to update.';return}
const ss=await rpc('KVS.Get',{key:'cc:ss'}).then(r=>ssState(0,r.value),e=>ssState(e.code||-1,'')),sw=await g('/rpc/Switch.GetStatus?id=0'),cr=await g('/rpc/KVS.Get?key=cc:cfg').then(r=>r.value).catch(()=>null);
if(!idleOk(null,ss,sw.current,cfgParse(cr))){$('up_res').textContent='An open charging session or current above the residual threshold: update after charging.';return}
for(const n of['Led','Page']){const o=L.scripts.find(x=>x.name===n);if(o)await rpc('Script.Stop',{id:o.id}).catch(x=>{})}
await rpc('Script.Start',{id:s.id});location.href='/script/'+s.id+'/install'}catch(x){$('up_res').textContent='Could not start the installer: '+x.message;try{const L=await g('/rpc/Script.List');for(const o of L.scripts)if((o.name==='Led'||o.name==='Page')&&!o.running)await rpc('Script.Start',{id:o.id}).catch(y=>{})}catch(y){}}}});
document.addEventListener('change',e=>{if(e.target.id==='imf'&&e.target.files[0])importFile(e.target.files[0])});
async function save(){const f=readForm(),v=validateForm(f,MODEL);
document.querySelectorAll('.er').forEach(x=>x.textContent='');Object.keys(v.errors).forEach(k=>{const x=$('e_'+k);if(x)x.textContent=v.errors[k];else $('e_cfg').textContent=v.errors[k]});
if(Object.keys(v.errors).length){$('res').textContent='Not saved: fix the marked fields.';return}
const P=writePlan(OLD,v);if(!P.length){$('res').textContent='Nothing changed.';return}
$('save').disabled=true;await runPlan(P,'res','Saved. Live within about a minute.');
try{await load()}catch(x){}$('save').disabled=false}
async function runPlan(P,o,okMsg){let h='',bad=0;$(o).innerHTML='';
const fails=[];for(const p of P){if(skipItem(p,fails)){if(fails.indexOf('skip')<0){fails.push('skip');bad++;h+='<div class="er">&#10007; Mail template not saved; the stored one may be damaged - save again</div>';$(o).innerHTML=h}continue}
try{if(p.params.name==='MailTpl'){const L=await g('/rpc/Script.List'),s=L.scripts.find(x=>x.name==='MailTpl');p.params.id=s?s.id:(await rpc('Script.Create',{name:'MailTpl'})).id;delete p.params.name}
const r=await rpc(p.rpc,p.params);h+='<div class="ok">&#10003; '+esc(p.label)+(r&&r.restart_required?' (restart needed)':'')+'</div>'}catch(x){fails.push(p.rpc);bad++;h+='<div class="er">&#10007; '+esc(p.label)+': '+esc(x.message)+'</div>'}$(o).innerHTML=h}
if(bad)$(o).innerHTML=h+'<div class="mu">Some changes failed.</div>';
else{$(o).innerHTML='<div class="ok" id="'+o+'_ok"><b>&#10003; '+okMsg+'</b></div>';setTimeout(()=>{const e=$(o+'_ok');if(e)e.remove()},5000)}
return bad}
load().catch(e=>{$('dev').textContent='Could not read the plug ('+e+'). Reload the page.'});
</script></body></html>
