$('pend').innerHTML=UI.length?'<a href="#undc">&#9888; '+UI.length+' undated charge(s) ('+fmtKwh(wh,CFG.ds)+') &ndash; assign</a>':'';
$('und').innerHTML=UI.map((x,i)=>'<label class="r m"><span><input type="checkbox" class="uc" data-i="'+i+'" onchange="selUnd()">Boot '+x.n+(x.up==='T'?' &middot; outside sessions':x.min?' &middot; '+fmtDur(x.min):'')+'</span><span>'+fmtKwh(x.wh,CFG.ds)+'</span></label><div class="d">'+(x.r.lo?'between '+fd(x.r.lo)+' and ':'until ')+fd(x.r.hi)+'</div>').join('');selUnd()}
const selU=()=>[...document.querySelectorAll('.uc')].filter(c=>c.checked).map(c=>UI[+c.dataset.i]);
function selUnd(){const sel=selU(),r=rangeOf(sel.map(x=>x.r)),d=$('udd'),v=d.value;
d.innerHTML='<option value="">Pick the day</option>'+(sel.length&&r.ok?daysIn(r.lo,r.hi,120).map(x=>'<option value="'+x+'"'+(x===v?' selected':'')+'>'+fd(x)+'</option>').join(''):'');
$('uda').disabled=!sel.length||!r.ok;
$('udr').textContent=sel.length&&!r.ok?'The chosen charges do not fit on the same day.':''}
const nowU=()=>D&&D.unix>1.7e9?D.unix:Math.floor(Date.now()/1000);const tkey=()=>dayKeyOf(nowU(),D?D.off:0);
async function sync(){const now=Math.floor(Date.now()/1000);if(!(D.unix>1.7e9)||Math.abs(D.unix-now)>60){await j('time?set='+now);D=await j('data?m='+tkey().slice(0,6))}}
function show(){const t=new Date((D.unix+D.off)*1000);const ok=D.unix>1.7e9;
$('clk').innerHTML=ok?t.toLocaleDateString(navigator.language,{weekday:'short',timeZone:'UTC'})+' '+fd(tkey())+' &middot; '+pad(t.getUTCHours())+':'+pad(t.getUTCMinutes())+' <span style="color:var(--ok)">&#10003;</span>':'<span style="color:var(--warn)">&#9888; clock unknown &ndash; setting&hellip;</span>';
$('w').textContent=fmtW(D.w,CFG.ds);const R=$('rel'),ic=relayIcon({output:D.on,errors:D.er});R.className='sw '+ic;R.setAttribute('aria-checked',D.on?'true':'false');$('rs').textContent=ic==='cut'?'Cut by protection':D.on?'On':'Off';
const tk=tkey(),mk=tk.slice(0,6);let m=pm(D.m);if(D.k!==mk)m=null;if(m)months[mk]=m;else m={s:0,days:[]};
$('td').textContent=fmtWh(todayWh(D,D.k===mk?m:null,tk),CFG.ds);$('mn').textContent=mname(mk);$('mt').textContent=fmtWh(monthWh(D,m,mk,tk),CFG.ds)}
async function tick(){try{const was=D?D.on:null;D=await j('data'+(D?'?m='+tkey().slice(0,6):''));show();if(was!==null&&was!==D.on)setTimeout(refLog,2500)}catch(e){$('clk').textContent='no connection to the plug'}}
async function hist(){try{const L=await j('list');const ks=L.months.sort().reverse();let h='',o='';const tk=tkey();
for(const k of ks){if(!months[k]){const r=await j('data?m='+k);months[k]=pm(r.m)||{s:0,days:[]}}const m=months[k];
const ds=m.days.map((x,i)=>x?'<div>'+dname(k,i)+' &nbsp; '+fmtWh(x,CFG.ds)+'</div>':'').join('');
h+='<div class="m r" onclick="this.nextSibling.hidden=!this.nextSibling.hidden"><span>'+mname(k)+'</span><span>'+fmtWh(monthWh(D,m,k,tk),CFG.ds)+' &#9656;</span></div><div class="d" hidden>'+(ds||'no consumption')+'</div>';o+='<option value="'+k+'">'+mname(k)+'</option>'}
$('hist').innerHTML=h||'no data';$('sel').innerHTML=o;if(ks.length)$('sel').value=defaultMonth(ks,tk);ADJ=(L.adj||[]).filter(x=>x[2]!=='u');loadLogs();
const a=ADJ.map(x=>'<div class="adj">'+x[0]+': '+fmtWh(x[1],CFG.ds)+' &ndash; '+(AJ[x[2]]||x[2])+'</div>');$('adjs').innerHTML=a.length?'<div class="lab" style="margin-top:10px">Adjustments</div>'+a.join(''):''}
catch(e){$('hist').textContent='Could not read the history ('+e+'). Reload the page.'}}
$('mail').onclick=async()=>{const k=$('sel').value,m=months[k];if(!m)return;
if(UI.length&&!confirm(UI.length+' undated charge(s) are not in the report. Send anyway?'))return;
const mt=MT||{subject:'Charging report | {month_name} {year}',body:'Total: {total_kwh} kWh\n\n{sessions_table}'},l=sessOf(k);
const v=mailVars({k:k,sessions:l,totalWh:monthWh(D,m,k,tkey()),cfg:CFG,name:DN});
const u=mailUrl(mt,renderTpl(mt.subject,v),renderTpl(mt.body,v));
if(u.copy)try{await navigator.clipboard.writeText(u.copy)}catch(e){}
location.href=u.url};
$('csv').onclick=()=>{const tk=tkey(),ks=Object.keys(months).sort(),days=[],mos=[],ss=[],ev=[];
ks.forEach(k=>{months[k].days.forEach((x,i)=>days.push([isoD(k+pad(i+1)),x]));mos.push([k.slice(0,4)+'-'+k.slice(4),Math.round(monthWh(D,months[k],k,tk))])});
Object.keys(LOGS).sort().forEach(k=>sessOf(k).forEach(s=>{s.end=endHm(s);s.cost=hasPrice(CFG)?costOf(s.wh,CFG):'';ss.push(s)}));
const L=LOGS[$('sel').value];if(L)evLines(L.ev,L.ei,L.boot).forEach(x=>{const d=x.when?new Date((x.when+D.off)*1000).toISOString():'';ev.push({date:d.slice(0,10),time:d.slice(11,16),text:x.text+(x.loss?' (no power since ~'+tms(x.loss)+')':'')})});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csvText(days,mos,ss,ev)],{type:'text/csv;charset=utf-8'}));a.download='chargelens-'+tk+'.csv';document.body.appendChild(a);a.click();a.remove()};
$('sel').onchange=showLog;
$('uda').onclick=async()=>{const sel=selU(),v=$('udd').value,r=rangeOf(sel.map(x=>x.r));
if(!sel.length||!v||v<r.lo||v>r.hi){$('udr').textContent='Pick the day from the list.';return}
$('uda').disabled=true;$('udr').textContent='assigning...';
try{for(const x of sel)await j('time?boot='+x.n+'&up='+x.up+'&day='+v.replace(/-/g,''))}catch(e){$('udr').textContent='Failed ('+e+')';$('uda').disabled=false;return}
setTimeout(async()=>{months={};await hist();$('udr').textContent='Assigned to '+fd(v)+'.'},1500+800*sel.length)};
$('rel').onclick=async()=>{if(!D)return;const on=!D.on;if(!on&&!confirm('Turn the socket off? Charging stops.'))return;await fetch('/rpc/Switch.Set?id=0&on='+on);tick()};
$('ts').onclick=async()=>{const now=Math.floor(Date.now()/1000);try{const r=await j('time?set='+now);$('tsr').textContent='Clock set'+(r.prev>1.7e9?' (difference: '+(now-r.prev)+' s)':'');tick()}catch(e){$('tsr').textContent='Could not set the clock'}};
(async()=>{try{CFG=cfgParse((await g('/rpc/KVS.Get?key=cc:cfg')).value)}catch(e){}
scode('MailTpl').then(c=>{try{MT=JSON.parse(c)}catch(e){}}).catch(e=>{});g('/rpc/Shelly.GetDeviceInfo').then(r=>{DN=r.name||''}).catch(e=>{});
await tick();if(D){await sync();show();hist()}setInterval(tick,5000)})();
</script></body></html>
