</div><script>
document.querySelector('img.lg').src=document.querySelector('link[rel=icon]').href;

/* ==== PURE ==== */
/*@lib cfg_lib.js*/
const pad=n=>String(n).padStart(2,'0');
/* formats: ds = decimal separator, df = date format of cc:cfg (CSV stays ISO and dot) */
function fmtNum(x,dec,ds){return x.toFixed(dec).replace('.',ds||'.')}
function fmtW(w,ds){return Math.round(w*100)/100<1000?fmtNum(w,2,ds)+' W':fmtNum(w/1000,2,ds)+' kW'}
function fmtWh(wh,ds){return Math.round(wh*100)/100<1000?fmtNum(wh,2,ds)+' Wh':fmtNum(wh/1000,2,ds)+' kWh'}
function fmtKwh(wh,ds){return fmtNum(wh/1000,2,ds)+' kWh'}
function fmtDate(k,df){const d=String(k).replace(/\D/g,''),y=d.slice(0,4),m=d.slice(4,6),x=d.slice(6,8);return df==='DMY'?x+'/'+m+'/'+y:df==='MDY'?m+'/'+x+'/'+y:y+'-'+m+'-'+x}
function fmtShort(k,df){const d=String(k).replace(/\D/g,''),m=d.slice(4,6),x=d.slice(6,8);return df==='DMY'?x+'/'+m:df==='MDY'?m+'/'+x:m+'-'+x}
function dayKeyOf(u,off){const t=new Date((u+off)*1000);return t.getUTCFullYear()+pad(t.getUTCMonth()+1)+pad(t.getUTCDate())}
function prevMonth(k){let y=+k.slice(0,4),m=+k.slice(4)-1;if(m<1){m=12;y--}return y+pad(m)}
function unsavedWh(D){const u=D.e-D.st.c;return u>0&&u<100000?u:0}
function todayWh(D,m,tk){const u=unsavedWh(D);if(D.st.dk===tk)return D.st.dw+u;if(m&&tk.slice(0,6)===D.k)return (m.days[+tk.slice(6)-1]||0)+u;return u}
function monthWh(D,m,k,tk){let t=0;m.days.forEach((x,i)=>{t+=(D.st.dk===k+pad(i+1))?D.st.dw:x});return t+(k===tk.slice(0,6)?unsavedWh(D):0)}
function defaultMonth(ks,tk){const cur=tk.slice(0,6),p=prevMonth(cur);if(+tk.slice(6)<=5&&ks.indexOf(p)>=0)return p;return ks.indexOf(cur)>=0?cur:ks[0]}
/* cost: one price per kWh (cfg.p); without a price (p = 0) every cost line and column is hidden */
const hasPrice=c=>c.p>0;
const costOf=(wh,c)=>Math.round(wh/1000*c.p*100)/100;
const fmtCost=(wh,c)=>hasPrice(c)?fmtNum(costOf(wh,c),2,c.ds):"";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function daysIn(lo,hi,max){const out=[],e=Date.parse(hi+'T00:00:00Z');let t=lo?Date.parse(lo+'T00:00:00Z'):e-(max-1)*864e5;
if(e-t>(max-1)*864e5)t=e-(max-1)*864e5;for(;t<=e;t+=864e5)out.push(new Date(t).toISOString().slice(0,10));return out}
function fmtDur(min){return Math.floor(min/60)+'h'+pad(min%60)}
function parseSessions(vals,m){const out=[];vals.forEach(v=>{if(!v)return;v.split(';').forEach(l=>{const p=l.split(','),h=p[1];
const s={day:m.slice(0,4)+'-'+m.slice(4)+'-'+p[0],hhmm:h==='----'||h[0]==='~'?null:h.slice(0,2)+':'+h.slice(2),min:+p[2],wh:+p[3],f:p[4]||''};
if(h[0]==='~'){const x=h.slice(1).split('.');s.b=+x[0];s.up=+x[1]}out.push(s)})});return out}
const sortS=l=>l.slice().sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:(a.hhmm||'')<(b.hhmm||'')?-1:(a.hhmm||'')>(b.hhmm||'')?1:0);
const hmMin=h=>+h.slice(0,2)*60+ +h.slice(3);
function endHm(s){if(!s.hhmm)return '';const e=(hmMin(s.hhmm)+s.min)%1440;return pad(Math.floor(e/60))+':'+pad(e%60)}
function pairInterrupted(l){l.forEach((s,i)=>{const n=l[i+1];s.int=!!(s.f.indexOf('p')>=0&&n&&s.hhmm&&n.hhmm&&n.day===s.day&&hmMin(n.hhmm)-(hmMin(s.hhmm)+s.min)<=30)});return l}
/* v2.1 manual dating: items of cc:su (sessions; a boot's T line only when it has no sessions left), current boot hidden */
const upN=u=>u==='T'?1e12:+u;
function undatedItems(su,cur){const L=su?su.split(';').map(l=>{const p=l.split(',');return{n:+p[0],up:p[1],min:+p[2],wh:+p[3],f:p[4]||''}}):[];
const hs={};L.forEach(x=>{if(x.up!=='T')hs[x.n]=1});return L.filter(x=>x.n!==cur&&(x.up!=='T'||!hs[x.n])).sort((a,b)=>a.n-b.n||upN(a.up)-upN(b.up))}
function boundsOf(it,boots,man,today,first,off){let lo=first,hi=today;const u=upN(it.up);
Object.keys(boots).forEach(b=>{const d=dayKeyOf(boots[b],off).replace(/(....)(..)(..)/,'$1-$2-$3');if(+b<it.n&&d>lo)lo=d;if(+b>it.n&&d<hi)hi=d});
man.forEach(s=>{if(s.b===undefined)return;const bf=s.b<it.n||(s.b===it.n&&s.up<u);if(bf&&s.day>lo)lo=s.day;if(!bf&&s.day<hi)hi=s.day});return{lo:lo,hi:hi}}
function rangeOf(rs){let lo='',hi='9999-12-31';rs.forEach(r=>{if(r.lo>lo)lo=r.lo;if(r.hi<hi)hi=r.hi});return{lo:lo,hi:hi,ok:lo<=hi}}
/* mail: template MailTpl {to,cc,bcc,subject,body} with {placeholders}; sessions = parsed sessions of the month */
function monthName(k,lang){const d=new Date(Date.UTC(+k.slice(0,4),+k.slice(4,6)-1,1)),o={month:'long',timeZone:'UTC'};let n;
try{n=d.toLocaleString(lang||navigator.language,o)}catch(e){n=d.toLocaleString(navigator.language,o)}return n.charAt(0).toUpperCase()+n.slice(1)}
function sessionsTable(l,c){return l.map(s=>fmtDate(s.day,c.df)+' | '+fmtNum(s.wh/1000,2,c.ds)+(hasPrice(c)?' | '+fmtCost(s.wh,c):'')).join('\n')}
function mailVars(x){const c=x.cfg,sw=x.sessions.reduce((a,s)=>a+s.wh,0);
return{month_name:monthName(x.k,x.lang),month:x.k.slice(4,6),year:x.k.slice(0,4),total_kwh:fmtNum(x.totalWh/1000,2,c.ds),total_cost:fmtCost(x.totalWh,c),
currency:c.cu,price:String(c.p).replace('.',c.ds),outside_kwh:fmtNum(Math.max(0,Math.round(x.totalWh-sw))/1000,2,c.ds),
session_count:String(x.sessions.length),sessions_table:sessionsTable(x.sessions,c),device_name:x.name||''}}
/* default mail template: the same text as src/mail-default.json (a test compares them) */
const MAILD={subject:'Charging report | {month_name} {year}',body:'Hello,\n\nHere is the charging report for {month_name} {year}.\n\nTotal: {total_kwh} kWh in {session_count} session(s).\n\nSessions:\n{sessions_table}\n\nEnergy outside sessions: {outside_kwh} kWh\n\nPlease confirm that you received this report.\n\nSignature: replace this line\n'};
/* a stored template that lacks a subject or body (or is not an object) gets the default text, field by field */
const mailTpl=m=>{m=m&&typeof m==='object'?m:{};const t=x=>typeof x==='string';return{to:t(m.to)?m.to:'',cc:t(m.cc)?m.cc:'',bcc:t(m.bcc)?m.bcc:'',subject:t(m.subject)?m.subject:MAILD.subject,body:t(m.body)?m.body:MAILD.body,lang:t(m.lang)?m.lang:''}};
/* the plug serves http (no secure context, so no navigator.clipboard): copy through a selected textarea */
function copyText(s){const a=document.createElement('textarea');a.value=s;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(a);
if(!ok&&navigator.clipboard)navigator.clipboard.writeText(s).catch(e=>{});return ok}
function renderTpl(t,v){return String(t).replace(/\{(\w+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(v,k)?String(v[k]):m)}
const mu1=s=>encodeURIComponent(s||"").replace(/%2C/g,',').replace(/%40/g,'@');
/* longest mailto opened as is (the private build sent ~3 KB reports whole); longer: body on the clipboard */
const MAILTO_MAX=8000;
function mailUrl(mt,subject,body){const u=b=>'mailto:'+mu1(mt.to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(b)+(mt.cc?'&cc='+mu1(mt.cc):'')+(mt.bcc?'&bcc='+mu1(mt.bcc):'');
const url=u(body);return url.length>MAILTO_MAX?{url:u('The report is on the clipboard: paste it here.'),copy:body}:{url:url,copy:''}}
/* CSV: machine friendly (ISO dates, dot decimals, comma, CRLF, no BOM); event text goes into the last column */
const csvF=v=>/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
function csvText(days,months,sessions,events){const r=a=>a.map(v=>csvF(String(v))).join(',')+'\r\n',k3=wh=>(wh/1000).toFixed(3);
let c=r(['type','date','start','end','min','wh','kwh','cost','flags']);
days.forEach(d=>c+=r(['day',d[0],'','','',d[1],k3(d[1]),'','']));months.forEach(d=>c+=r(['month',d[0],'','','',d[1],k3(d[1]),'','']));
sessions.forEach(s=>c+=r(['session',s.day,s.hhmm||'',s.end||'',s.min,s.wh,k3(s.wh),s.cost===undefined?'':s.cost,s.f||'']));
events.forEach(e=>c+=r(['event',e.date,e.time,'','','','','',e.text]));return c}
function relayIcon(sw){const e=sw.errors||[];return e.indexOf('overcurrent')>=0||e.indexOf('overpower')>=0?'cut':sw.output?'on':'off'}
/* events: raw line "R,stamp,1/source" -> text (stamps are resolved by evLines) */
function evText(l){const p=l.split(','),x=(p[2]||'').split('/');
if(p[0]==='R')return 'Relay '+(x[0]==='1'?'on':'off')+' ('+(x[1]||'?')+')';
if(p[0]==='B')return 'Boot (reason '+x[0]+')';
if(p[0]==='U')return 'Script restarted (update)';
if(p[0]==='L')return 'Old data format found';
return l}
function bootsOf(s){const b={};(s||'').split(';').forEach(x=>{const p=x.split(':');if(p.length===3)b[p[0]]=+p[1]});return b}
function resolveSt(st,b){if(st&&st[0]==='~'){const p=st.slice(1).split('.');return b[p[0]]!==undefined?b[p[0]]+ +p[1]:null}return st?+st:null}
function evLines(ev,ei,bs){const b=bootsOf(bs),out=[];for(let k=1;k<=3;k++){const v=ev[(ei+k)%3];if(!v)continue;v.split(';').forEach(l=>{const p=l.split(','),x=(p[2]||'').split('/');
const o={when:resolveSt(p[1],b),text:evText(l)};if(p[0]==='B')o.loss=resolveSt(x[1],b);out.push(o)})}return out}
/* about card: version from the Meter header, the access point and the page address on it (the AP is always 192.168.33.1) */
const aboutHtml=(v,ap,path)=>{const u='http://192.168.33.1'+path;return '<div>ChargeLens '+(v?esc(v):'(version unknown)')+'</div><div>'+
(!ap?'Access point: unknown':ap.enable?'Access point <b>'+esc(ap.ssid||'')+'</b>: <a href="'+esc(u)+'">'+esc(u)+'</a><div class="mu">Join that Wi-Fi network, then open this address.</div>':'Access point: off (Setup, Wi-Fi access point)')+'</div>'};
/* ==== END PURE ==== */
const B=location.pathname.replace(/\/ui$/,'/');
const AJ={u:'undated energy (assigned to the day the clock was set)',m:'energy of the previous month added to day 1',s:'counter jump ignored',b:'counter went back (energy lost)'};
const $=i=>document.getElementById(i);const g=u=>fetch(u).then(r=>r.json());const j=u=>g(B+u);
let CFG=cfgParse(null),MT=null,DN='';
const mon=x=>fmtNum(x,2,CFG.ds)+' '+esc(CFG.cu),fd=d=>fmtDate(d,CFG.df),mname=k=>monthName(k)+' '+k.slice(0,4),dname=(k,i)=>fd(k+pad(i+1));
const pm=v=>{if(!v)return null;const p=v.split('|');return{s:+p[0],days:p[1]?p[1].split(',').map(Number):[]}};
let D=null,months={},ADJ=[],LOGS={};
async function scode(n){const L=await g('/rpc/Script.List'),s=L.scripts.find(x=>x.name===n);if(!s)return '';let h='',o=0,r;
do{r=await g('/rpc/Script.GetCode?id='+s.id+'&offset='+o);h+=r.data;o+=r.data.length}while(r.left>0&&r.data.length);return h}
const tms=u=>{const t=new Date((u+D.off)*1000);return fmtShort(dayKeyOf(u,D.off),CFG.df)+' '+pad(t.getUTCHours())+':'+pad(t.getUTCMinutes())};
const sessOf=k=>LOGS[k]?pairInterrupted(sortS(parseSessions(LOGS[k].s,k))):[];let UI=[];
function sumS(l){let wh=0,c=0;l.forEach(s=>{wh+=s.wh;c+=costOf(s.wh,CFG)});return{wh:wh,c:Math.round(c*100)/100}}
function showLog(){const k=$('sel').value,L=LOGS[k];if(!L){$('ses').textContent='no data';return}
const l=sessOf(k),tot=sumS(l),m=months[k],P=hasPrice(CFG);
let h=l.length?'<table class="t"><tr><th>Date</th><th>Start</th><th>End</th><th>Duration</th><th>kWh</th>'+(P?'<th>'+esc(CFG.cu)+'</th>':'')+'</tr>'+l.map(s=>'<tr'+(s.int?' style="color:var(--warn)"':'')+'><td>'+fmtShort(s.day,CFG.df)+'</td><td>'+(s.hhmm||'&ndash;')+'</td><td>'+(endHm(s)||'&ndash;')+'</td><td>'+(s.hhmm||s.min?fmtDur(s.min):'&ndash;')+'</td><td>'+fmtNum(s.wh/1000,2,CFG.ds)+'</td>'+(P?'<td>'+fmtCost(s.wh,CFG)+'</td>':'')+'</tr>').join('')+'</table>':'<div>no sessions</div>';
h+='<div class="r"><span>Total</span><span>'+fmtKwh(tot.wh,CFG.ds)+(P?' &middot; '+mon(tot.c):'')+'</span></div>';
if(P)h+='<div>Price '+String(CFG.p).replace('.',CFG.ds)+' '+esc(CFG.cu)+'/kWh</div>';
if(m){const out=Math.round(monthWh(D,m,k,tkey()))-tot.wh;if(out>0)h+='<div>Outside sessions: '+fmtKwh(out,CFG.ds)+(P?' ('+mon(costOf(out,CFG))+')':'')+'</div>'}
const y=k.slice(0,4);let yw=0,yc=0;Object.keys(LOGS).forEach(x=>{if(x.slice(0,4)===y){const t=sumS(sessOf(x));yw+=t.wh;yc+=t.c}});
h+='<div>Year '+y+': '+fmtKwh(yw,CFG.ds)+(P?' &middot; '+mon(yc):'')+'</div>';
if(l.some(s=>s.int))h+='<div class="adj">Orange: charge interrupted by a power cut (continues on the next line).</div>';
if(L.l)h+='<div class="adj">'+L.l+' record(s) lost: memory full.</div>';$('ses').innerHTML=h;
showUnd(L);
const e=evLines(L.ev,L.ei,L.boot).reverse();
$('evs').innerHTML=e.length?e.map(x=>'<div>'+(x.when?tms(x.when):'?')+' &middot; '+esc(x.text)+(x.loss?' &ndash; no power since ~'+tms(x.loss):'')+'</div>').join(''):'no events'}
async function loadLogs(){try{for(const o of $('sel').options)LOGS[o.value]=await j('log?m='+o.value);showLog()}catch(e){$('ses').textContent='Could not read the sessions ('+e+').'}}
async function refLog(){const k=$('sel').value;if(!k)return;try{LOGS[k]=await j('log?m='+k);showLog()}catch(e){}}
const isoD=k=>k.replace(/(....)(..)(..)/,'$1-$2-$3');
function showUnd(L){const cur=D&&D.unix>1.7e9&&D.st.nb?D.st.n:-1,man=[],ks=Object.keys(LOGS).sort();UI=undatedItems(L.su,cur);
ks.forEach(x=>parseSessions(LOGS[x].s,x).forEach(s=>man.push(s)));const first=ks.length?isoD(ks[0]+'01'):'',bt=bootsOf(L.boot);let wh=0;
UI.forEach(x=>{x.r=boundsOf(x,bt,man,isoD(tkey()),first,D.off);wh+=x.wh});$('undc').hidden=!UI.length;
$('pend').innerHTML=UI.length?'<a href="#undc">&#9888; '+UI.length+' undated charge(s) ('+fmtKwh(wh,CFG.ds)+') &ndash; assign</a>':'';
$('und').innerHTML=UI.map((x,i)=>'<label class="r m"><span><input type="checkbox" class="uc" data-i="'+i+'" onchange="selUnd()">Boot '+x.n+(x.up==='T'?' &middot; outside sessions':x.min?' &middot; '+fmtDur(x.min):'')+'</span><span>'+fmtKwh(x.wh,CFG.ds)+'</span></label><div class="d">'+(x.r.lo?'between '+fd(x.r.lo)+' and ':'until ')+fd(x.r.hi)+'</div>').join('');selUnd()}
const selU=()=>[...document.querySelectorAll('.uc')].filter(c=>c.checked).map(c=>UI[+c.dataset.i]);
function selUnd(){const sel=selU(),r=rangeOf(sel.map(x=>x.r)),d=$('udd'),v=d.value;
d.innerHTML='<option value="">Pick the day</option>'+(sel.length&&r.ok?daysIn(r.lo,r.hi,120).map(x=>'<option value="'+x+'"'+(x===v?' selected':'')+'>'+fd(x)+'</option>').join(''):'');
$('uda').disabled=!sel.length||!r.ok;
$('udr').textContent=sel.length&&!r.ok?'The chosen charges do not fit on the same day.':''}
const nowU=()=>D&&D.unix>1.7e9?D.unix:Math.floor(Date.now()/1000);const tkey=()=>dayKeyOf(nowU(),D?D.off:0);
async function sync(){const now=Math.floor(Date.now()/1000);if(!(D.unix>1.7e9)||Math.abs(D.unix-now)>60){await j('time?set='+now);D=await j('data?m='+tkey().slice(0,6))}}
function show(){const t=new Date((D.unix+D.off)*1000);const ok=D.unix>1.7e9;
$('clk').innerHTML=ok?t.toLocaleDateString(navigator.language,{weekday:'short',timeZone:'UTC'})+' '+fd(tkey())+' &middot; '+pad(t.getUTCHours())+':'+pad(t.getUTCMinutes())+' <span style="color:var(--ok)">&#10003;</span>':'<span style="color:var(--warn)">&#9888; clock unknown &ndash; setting&hellip;</span>';
$('w').textContent=fmtW(D.w,CFG.ds);const R=$('rel'),ic=relayIcon({output:D.on,errors:D.er});R.className='sw '+ic;R.setAttribute('aria-checked',D.on?'true':'false');$('rs').textContent=ic==='cut'?'Cut by protection':D.on?'On':'Off';
const tk=tkey(),mk=tk.slice(0,6);let m=pm(D.m);if(D.k!==mk)m=null;if(m)months[mk]=m;else m={s:0,days:[]};
$('td').textContent=fmtWh(todayWh(D,D.k===mk?m:null,tk),CFG.ds);$('mn').textContent=mname(mk);$('mt').textContent=fmtWh(monthWh(D,m,mk,tk),CFG.ds)}
async function tick(){try{const was=D?D.on:null;D=await j('data'+(D?'?m='+tkey().slice(0,6):''));show();if(was!==null&&was!==D.on)setTimeout(refLog,2500)}catch(e){$('clk').textContent='no connection to the plug'}}
async function hist(){try{const L=await j('list');const ks=L.months.sort().reverse();let h='',o='';const tk=tkey();
for(const k of ks){if(!months[k]){const r=await j('data?m='+k);months[k]=pm(r.m)||{s:0,days:[]}}const m=months[k];
const ds=m.days.map((x,i)=>x?'<div>'+dname(k,i)+' &nbsp; '+fmtWh(x,CFG.ds)+'</div>':'').join('');
h+='<div class="m r" onclick="this.nextSibling.hidden=!this.nextSibling.hidden"><span>'+mname(k)+'</span><span>'+fmtWh(monthWh(D,m,k,tk),CFG.ds)+' &#9656;</span></div><div class="d" hidden>'+(ds||'no consumption')+'</div>';o+='<option value="'+k+'">'+mname(k)+'</option>'}
$('hist').innerHTML=h||'no data';$('sel').innerHTML=o;if(ks.length)$('sel').value=defaultMonth(ks,tk);ADJ=(L.adj||[]).filter(x=>x[2]!=='u');loadLogs();
const a=ADJ.map(x=>'<div class="adj">'+x[0]+': '+fmtWh(x[1],CFG.ds)+' &ndash; '+(AJ[x[2]]||x[2])+'</div>');$('adjs').innerHTML=a.length?'<div class="lab" style="margin-top:10px">Adjustments</div>'+a.join(''):''}
catch(e){$('hist').textContent='Could not read the history ('+e+'). Reload the page.'}}
$('mail').onclick=async()=>{const k=$('sel').value,m=months[k];if(!m)return;
if(UI.length&&!confirm(UI.length+' undated charge(s) are not in the report. Send anyway?'))return;
const mt=mailTpl(MT),l=sessOf(k);
const v=mailVars({k:k,sessions:l,totalWh:monthWh(D,m,k,tkey()),cfg:CFG,name:DN,lang:mt.lang||undefined});
const u=mailUrl(mt,renderTpl(mt.subject,v),renderTpl(mt.body,v));
if(u.copy&&!copyText(u.copy)&&!navigator.clipboard)alert('The report could not be copied. Use the CSV export instead.');
location.href=u.url};
$('csv').onclick=()=>{const tk=tkey(),ks=Object.keys(months).sort(),days=[],mos=[],ss=[],ev=[];
ks.forEach(k=>{months[k].days.forEach((x,i)=>days.push([isoD(k+pad(i+1)),x]));mos.push([k.slice(0,4)+'-'+k.slice(4),Math.round(monthWh(D,months[k],k,tk))])});
Object.keys(LOGS).sort().forEach(k=>sessOf(k).forEach(s=>{s.end=endHm(s);s.cost=hasPrice(CFG)?costOf(s.wh,CFG):'';ss.push(s)}));
const L=LOGS[$('sel').value];if(L)evLines(L.ev,L.ei,L.boot).forEach(x=>{const d=x.when?new Date((x.when+D.off)*1000).toISOString():'';ev.push({date:d.slice(0,10),time:d.slice(11,16),text:x.text+(x.loss?' (no power since ~'+tms(x.loss)+')':'')})});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csvText(days,mos,ss,ev)],{type:'text/csv;charset=utf-8'}));a.download='chargelens-'+tk+'.csv';document.body.appendChild(a);a.click();a.remove()};
$('sel').onchange=showLog;
async function about(){let v=null,ap=null;try{const m=(await g('/rpc/Script.List')).scripts.find(x=>x.name==='Meter');if(m){const q=/^\/\/ ChargeLens Meter v(\S+)/.exec((await g('/rpc/Script.GetCode?id='+m.id+'&offset=0&len=64')).data);if(q)v=q[1]}}catch(e){}
try{ap=(await g('/rpc/WiFi.GetConfig')).ap||null}catch(e){}$('abt').innerHTML=aboutHtml(v,ap,location.pathname)}
$('uda').onclick=async()=>{const sel=selU(),v=$('udd').value,r=rangeOf(sel.map(x=>x.r));
if(!sel.length||!v||v<r.lo||v>r.hi){$('udr').textContent='Pick the day from the list.';return}
$('uda').disabled=true;$('udr').textContent='assigning...';
try{for(const x of sel)await j('time?boot='+x.n+'&up='+x.up+'&day='+v.replace(/-/g,''))}catch(e){$('udr').textContent='Failed ('+e+')';$('uda').disabled=false;return}
setTimeout(async()=>{months={};await hist();$('udr').textContent='Assigned to '+fd(v)+'.'},1500+800*sel.length)};
$('rel').onclick=async()=>{if(!D)return;const on=!D.on;if(!on&&!confirm('Turn the socket off? Charging stops.'))return;await fetch('/rpc/Switch.Set?id=0&on='+on);tick()};
$('ts').onclick=async()=>{const now=Math.floor(Date.now()/1000);try{const r=await j('time?set='+now);$('tsr').textContent='Clock set'+(r.prev>1.7e9?' (difference: '+(now-r.prev)+' s)':'');tick()}catch(e){$('tsr').textContent='Could not set the clock'}};
(async()=>{try{CFG=cfgParse((await g('/rpc/KVS.Get?key=cc:cfg')).value)}catch(e){}
scode('MailTpl').then(c=>{try{MT=JSON.parse(c)}catch(e){}}).catch(e=>{});g('/rpc/Shelly.GetDeviceInfo').then(r=>{DN=r.name||''}).catch(e=>{});
await tick();if(D){await sync();show();hist()}setInterval(tick,5000);about()})();
</script></body></html>
