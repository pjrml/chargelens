name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: dist/ and library/ are up to date
        run: python tools/build.py --check
      - name: mangler unit tests
        run: python tools/test_mangle.py
      - name: page driver unit tests
        run: python tools/test_drive.py
      - name: no private or personal data
        run: python tools/check_private.py --generic-only
      - name: feature marker tests
        run: python tools/test_features.py
      - name: build tests (per-model builds, release.json)
        run: python tools/test_build.py
      - name: pure logic tests (Node), every build
        run: |
          set -e
          for b in plugs plugpmg3; do
            node tools/puretest.js --build $b tests/features_fixture.js tests/features_test.js
            node tools/puretest.js --build $b src/cfg_lib.js tests/cfg_test.js
            for t in meter meter_review stamp session session2 session3 event meter_cfg; do
              node tools/puretest.js --build $b src/meter.js tests/${t}_test.js
            done
            node tools/puretest.js --build $b src/led.js tests/led_test.js
            for t in page page2 page3 page_mail; do
              node tools/puretest.js --build $b src/page.html tests/${t}_test.js
            done
            node tools/puretest.js --build $b src/setup.html tests/setup_test.js
            node tools/puretest.js --build $b src/install.html tests/install_test.js
          done
